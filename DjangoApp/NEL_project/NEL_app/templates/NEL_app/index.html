<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProbNEL</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Basic styling for the page */
        .result {
            border: 1px solid #ccc;
            padding: 10px;
            margin-top: 20px;
        }

        /* Highlighting clickable entities */
        .entity {
            color: blue;
            cursor: pointer;
        }

        #context-box {
            border: 1px solid #ccc;
            padding: 10px;
            margin-top: 20px;
            width: 100%;
        }
    </style>
</head>
<body class="bg-light">
<div class="container mt-5">
    <h1 class="text-center">Named Entity Recognition and Disambiguation</h1>

    <form id="process-form" class="mb-4">
        {% csrf_token %}
        <textarea id="user_input" name="user_input" class="form-control" rows="5" cols="40" placeholder="Enter text here"></textarea><br>

        <button type="button" class="btn btn-primary" onclick="submitInput(event, 'dbpedia')">Process with DBpedia</button>
        <button type="button" class="btn btn-secondary" onclick="submitInput(event, 'wikidata')">Process with Wikidata</button>
    </form>

    <div id="result" class="result">
        <h3>Processed Text:</h3>
        <p id="text-with-entities"></p>
    </div>

    <div id="context-box">
        <h4>Entity Details</h4>
        <div id="entity-details-table">
            <div id="entity-details"></div>
        </div>
    </div>

    <br>

    <div class="mb-4">
        <h4>Upload Dataset (JSON):</h4>
        <input type="file" id="dataset-input" class="form-control" accept=".json">
        <button class="btn btn-info mt-2" onclick="uploadDataset()">Upload Dataset</button>
    </div>
</div>

<!-- Bootstrap JS (optional, for extra functionality like tooltips, popovers) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>

<script>
    function showEntityDetails(entityText, entityTag, probabilities, uri) {
        const entityDetails = document.getElementById("entity-details");
        entityDetails.innerHTML += `
                <h5>Entity: ${entityText}</h5>
                <p><strong>Class:</strong> ${entityTag}</p>
                <p><strong>DBpedia URI:</strong> <a href="${uri}" target="_blank">${uri}</a></p>
                <p><strong>Top Probabilities:</strong></p>
                <ul>
                    ${probabilities.map(prob => `<li>${prob[0]}: ${prob[1].toFixed(2)}</li>`).join("")}
                </ul>
                <hr>
            `;
    }

    function submitInput(event, source) {
        event.preventDefault(); // Prevent form submission

        const userInput = document.getElementById("user_input").value; // Get user input
        const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value; // Get CSRF token

        fetch("", {
            method: "POST",
            headers: {
                "Content-Type": "application/x-www-form-urlencoded",
                "X-Requested-With": "XMLHttpRequest",
                "X-CSRFToken": csrfToken
            },
            body: new URLSearchParams({
                user_input: userInput,
                source: source // Pass the process type to the backend
            })
        })
            .then(response => response.json())
            .then(data => {
                const resultDiv = document.getElementById("result");

                clearCurrentEntityDetails();

                if (data.error) {
                    resultDiv.innerHTML = `<p class="text-danger">Error: ${data.error}</p>`;
                } else {
                    // Highlight entities in the text
                    let textWithEntities = data.text;

                    // Replace entities with clickable spans
                    data.entities.forEach(entity => {
                        const entityText = entity.entity_label;
                        const regex = new RegExp(`\\b${entityText}\\b`, 'g'); // Match whole word
                        const probabilities = entity.probabilities;
                        const entityTag = entity.entity_type;
                        const uri = entity.uri;

                        textWithEntities = textWithEntities.replace(regex,
                            `<a href="${uri}" class="entity" target="_blank">${entityText}</a>`);

                        // Show entity details directly
                        showEntityDetails(entityText, entityTag, probabilities, uri);
                    });

                    document.getElementById("text-with-entities").innerHTML = textWithEntities;
                }
            })
            .catch(error => {
                console.error("Error:", error);
                const resultDiv = document.getElementById("result");
                resultDiv.innerHTML = `<p class="text-danger">An error occurred while processing your request.</p>`;
            });
    }

    function clearCurrentEntityDetails() {
        // Get the entity details container
        const entityDetailsTable = document.getElementById("entity-details-table");

        // Clear the container before adding new details
        entityDetailsTable.innerHTML = `
        <div id="entity-details"></div>
    `;
    }


    function uploadDataset() {
        const input = document.getElementById("dataset-input");
        const file = input.files[0];
        const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;

        if (file) {
            const formData = new FormData();
            formData.append("dataset", file);

            // Create an AbortController for the timeout mechanism
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 300000); // 300000ms = 5 minutes

            fetch("upload-dataset/", {
                method: "POST",
                headers: {
                    "X-CSRFToken": csrfToken
                },
                body: formData,
                signal: controller.signal // Attach the AbortController signal
            })
                .then(response => {
                    clearTimeout(timeout); // Clear the timeout if request completes
                    return response.json();
                })
                .then(data => {
                    console.log(data)
                    if (data.success) {
                        alert("Dataset uploaded successfully!");
                        console.log(data.content); // Debug: View the content of the JSON file
                    } else {
                        alert("Failed to upload dataset: " + data.error);
                    }
                })
                .catch(error => {
                    clearTimeout(timeout); // Clear the timeout in case of an error
                    if (error.name === "AbortError") {
                        alert("The request took too long and was aborted.");
                    } else {
                        console.error("Error:", error);
                        alert("An error occurred during upload.");
                    }
                });
        } else {
            alert("Please select a file to upload.");
        }
    }

</script>


</body>
</html>
