<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NER and NED Demo</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Basic styling for the page */
        .result {
            border: 1px solid #ccc;
            padding: 10px;
            margin-top: 20px;
        }

        /* Highlighting clickable entities */
        .entity {
            color: blue;
            cursor: pointer;
        }

        #context-box {
            border: 1px solid #ccc;
            padding: 10px;
            margin-top: 20px;
            width: 100%;
        }
    </style>
</head>
<body class="bg-light">
<div class="container mt-5">
    <h1 class="text-center">Named Entity Recognition and Disambiguation</h1>

    <form id="process-form" class="mb-4">
        {% csrf_token %}
        <textarea id="user_input" name="user_input" class="form-control" rows="5" cols="40" placeholder="Enter text here"></textarea><br>

        <button type="button" class="btn btn-primary" onclick="submitInput(event, 'dbpedia')">Process with DBpedia</button>
        <button type="button" class="btn btn-secondary" onclick="submitInput(event, 'wikidata')">Process with Wikidata</button>
    </form>

    <div id="result" class="result">
        <h3>Processed Text:</h3>
        <p id="text-with-entities"></p>
    </div>

    <div id="context-box">
        <h4>Entity Details</h4>
        <div id="entity-details"></div>
    </div>
</div>

<!-- Bootstrap JS (optional, for extra functionality like tooltips, popovers) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>

<script>
    function showEntityDetails(entityText, entityTag, probabilities, uri) {
        const entityDetails = document.getElementById("entity-details");
        entityDetails.innerHTML += `
                <h5>Entity: ${entityText}</h5>
                <p><strong>Class:</strong> ${entityTag}</p>
                <p><strong>DBpedia URI:</strong> <a href="${uri}" target="_blank">${uri}</a></p>
                <p><strong>Top Probabilities:</strong></p>
                <ul>
                    ${probabilities.map(prob => `<li>${prob[0]}: ${prob[1].toFixed(2)}</li>`).join("")}
                </ul>
                <hr>
            `;
    }

    function submitInput(event, source) {
        event.preventDefault(); // Prevent form submission

        const userInput = document.getElementById("user_input").value; // Get user input
        const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value; // Get CSRF token

        fetch("", {
            method: "POST",
            headers: {
                "Content-Type": "application/x-www-form-urlencoded",
                "X-Requested-With": "XMLHttpRequest",
                "X-CSRFToken": csrfToken
            },
            body: new URLSearchParams({
                user_input: userInput,
                source: source // Pass the process type to the backend
            })
        })
            .then(response => response.json())
            .then(data => {
                const resultDiv = document.getElementById("result");
                const entityDetailsDiv = document.getElementById("entity-details");
                entityDetailsDiv.innerHTML = ''; // Clear any previous details

                if (data.error) {
                    resultDiv.innerHTML = `<p class="text-danger">Error: ${data.error}</p>`;
                } else {
                    // Highlight entities in the text
                    let textWithEntities = data.text;

                    // Replace entities with clickable spans
                    data.entities.forEach(entity => {
                        const entityText = entity.entity_text;
                        const regex = new RegExp(`\\b${entityText}\\b`, 'g'); // Match whole word
                        const probabilities = entity.probabilities;
                        const entityTag = entity.entity_type;
                        const uri = entity.uri;

                        textWithEntities = textWithEntities.replace(regex,
                            `<a href="${uri}" class="entity" target="_blank">${entityText}</a>`);

                        // Show entity details directly
                        showEntityDetails(entityText, entityTag, probabilities, uri);
                    });

                    document.getElementById("text-with-entities").innerHTML = textWithEntities;
                }
            })
            .catch(error => {
                console.error("Error:", error);
                const resultDiv = document.getElementById("result");
                resultDiv.innerHTML = `<p class="text-danger">An error occurred while processing your request.</p>`;
            });
    }

</script>
</body>
</html>
