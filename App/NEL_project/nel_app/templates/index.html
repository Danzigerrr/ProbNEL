<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProbNEL</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Basic styling for the page */
        .result {
            border: 1px solid #ccc;
            padding: 10px;
            margin-top: 20px;
        }

        /* Highlighting clickable entities */
        .entity {
            color: blue;
            cursor: pointer;
        }

        #context-box {
            border: 1px solid #ccc;
            padding: 10px;
            margin-top: 20px;
            width: 100%;
        }
    </style>
</head>
<body class="bg-light">
<div class="container mt-5">
    <h1 class="text-center">ProbNEL</h1>
    <h2 class="text-center">Entity Linking System - Named Entity Recognition and Disambiguation</h2>
    <br>
    <form id="process-form" class="mb-4">
        <textarea id="user_input" name="user_input" class="form-control" rows="5" cols="40" placeholder="Enter text here"></textarea><br>
        <button type="button" class="btn btn-primary" onclick="submitInput(event, 'dbpedia')">Process with DBpedia</button>
    </form>


    <div id="loader-text-input" style="display: none; text-align: center; margin-top: 20px;">
        <div class="spinner-border" role="status">
            <span class="sr-only"></span>
        </div>
        <p>Please wait, processing the text...</p>
    </div>


    <div id="result" class="result">
        <h3>Processed Text:</h3>
        <p id="text-with-entities"></p>
    </div>

    <div id="context-box">
        <h4>Entity Details</h4>
        <div id="entity-details-table">
            <div id="entity-details"></div>
        </div>
    </div>

    <br>

    <div class="mb-4">
        <h4>Upload Dataset (JSON):</h4>
        <input type="file" id="dataset-input" class="form-control" accept=".json">
        <button class="btn btn-info mt-2" onclick="uploadDataset()">Upload Dataset</button>
    </div>

    <div id="loader-dataset" style="display: none; text-align: center; margin-top: 20px;">
        <div class="spinner-border" role="status">
            <span class="sr-only"></span>
        </div>
        <p>Please wait, processing the dataset...</p>
    </div>

    <div id="results-container" class="mt-4">
        <!-- evaluation results will be displayed here -->
    </div>

</div>

<!-- Bootstrap JS (optional, for extra functionality like tooltips, popovers) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>

<script>
    function showEntityDetails(entityText, entityTag, probabilities, uri) {
        const entityDetails = document.getElementById("entity-details");
        entityDetails.innerHTML += `
                <h5>Entity: ${entityText}</h5>
                <p><strong>Class:</strong> ${entityTag}</p>
                <p><strong>URI:</strong> <a href="${uri}" target="_blank">${uri}</a></p>
                <p><strong>Top Probabilities:</strong></p>
                <ul>
                    ${probabilities.map(prob => `<li>${prob[0]}: ${prob[1].toFixed(2)}</li>`).join("")}
                </ul>
                <hr>
            `;
    }

    function submitInput(event, knowledge_graph) {
        event.preventDefault(); // Prevent form submission

        const userInput = document.getElementById("user_input").value; // Get user input
        const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value; // Get CSRF token
        const loader = document.getElementById("loader-text-input");

        // Show the loader
        loader.style.display = "block";

        fetch("", {
            method: "POST",
            headers: {
                "Content-Type": "application/x-www-form-urlencoded",
                "X-Requested-With": "XMLHttpRequest",
                "X-CSRFToken": csrfToken
            },
            body: new URLSearchParams({
                user_input: userInput,
                knowledge_graph: knowledge_graph // Pass the process type to the backend
            })
        })
            .then(response => response.json())
            .then(data => {
                // Hide the loader
                loader.style.display = "none";

                const resultDiv = document.getElementById("result");

                clearCurrentEntityDetails();

                if (data.error) {
                    resultDiv.innerHTML = `<p class="text-danger">Error: ${data.error}</p>`;
                } else {
                    // Highlight entities in the text
                    let textWithEntities = data.text;

                    // Replace entities with clickable spans
                    data.entities.forEach(entity => {
                        const { entity_label, probabilities, entity_type, best_candidate_uri } = entity;
                        const regex = new RegExp(`\\b${entity_label}\\b`, 'g'); // Match whole word
                        const entity_uri = best_candidate_uri;

                        // Replace text with a clickable link
                        textWithEntities = textWithEntities.replace(
                            regex,
                            `<a href="${entity_uri}" class="entity" target="_blank">${entity_label}</a>`
                        );

                        // Show entity details
                        showEntityDetails(entity_label, entity_type, probabilities, entity_uri);
                    });


                    document.getElementById("text-with-entities").innerHTML = textWithEntities;
                }
            })
            .catch(error => {
                console.error("Error:", error);
                const resultDiv = document.getElementById("result");
                resultDiv.innerHTML = `<p class="text-danger">An error occurred while processing your request.</p>`;
            });
    }

    function clearCurrentEntityDetails() {
        // Get the entity details container
        const entityDetailsTable = document.getElementById("entity-details-table");

        // Clear the container before adding new details
        entityDetailsTable.innerHTML = `
        <div id="entity-details"></div>
    `;
    }

    function uploadDataset() {
        const input = document.getElementById("dataset-input");
        const file = input.files[0];
        const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;
        const loader = document.getElementById("loader-dataset");

        if (file) {
            const formData = new FormData();
            formData.append("dataset", file);

            // Show the loader
            loader.style.display = "block";

            // Create an AbortController for the timeout mechanism
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 60*60000); // 60 minutes

            fetch("run_test_on_dataset/", {
                method: "POST",
                headers: {
                    "X-CSRFToken": csrfToken
                },
                body: formData,
                signal: controller.signal // Attach the AbortController signal
            })
                .then(response => {
                    clearTimeout(timeout); // Clear the timeout if request completes
                    return response.json();
                })
                .then(data => {
                    // Hide the loader
                    loader.style.display = "none";

                    console.log(data);
                    if (data.success) {
                        const ner_results = data.ner_evaluation_results;
                        const ned_results = data.ned_evaluation_results;
                        displayEvaluationResults(ner_results, ned_results);
                    } else {
                        alert("Failed to upload dataset: " + data.error);
                    }
                })
                .catch(error => {
                    // Hide the loader
                    loader.style.display = "none";

                    clearTimeout(timeout); // Clear the timeout in case of an error
                    if (error.name === "AbortError") {
                        alert("The request took too long and was aborted.");
                    } else {
                        console.error("Error:", error);
                        alert("An error occurred during upload.");
                    }
                });
        } else {
            alert("Please select a file to upload.");
        }
    }

    function displayEvaluationResults(ner_results_string, ned_results_string) {
        const ner_results = JSON.parse(ner_results_string);
        const ned_results = JSON.parse(ned_results_string);

        // Create the container where evaluation results will be displayed
        const resultsContainer = document.getElementById("results-container");
        resultsContainer.innerHTML = ""; // Clear previous results

        resultsContainer.innerHTML = `
        <h4>Evaluation Results</h4>
        <ul>
            <li><strong>NER total GT entities in text:</strong> ${ner_results.total_ground_truth_entities}</li>
            <li><strong>NER correctly identified entities in text:</strong> ${ner_results.correctly_identified_entities}</li>
            <li><strong>NER Accuracy:</strong> ${ner_results.accuracy}</li>
            <br>
            <li><strong>NED Accuracy:</strong> ${ned_results.accuracy}</li>
            <li><strong>NED Precision:</strong> ${ned_results.precision}</li>
            <li><strong>NED Recall:</strong> ${ned_results.recall}</li>
            <li><strong>NED F1 Score:</strong> ${ned_results.f1_score}</li>
        </ul>
        `;

    }


</script>


</body>
</html>
